<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f5f3">
<title>Rumi — Your home away from home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ Design tokens ============ */
  :root{
    --bg:#f1f5f3; --surface:#ffffff; --surface-2:#f6f9f8;
    --ink:#16201e; --muted:#5f6e6a; --faint:#8a9895; --line:rgba(22,32,30,.08);

    --green:#39e75f; --green-2:#22c55e; --green-ink:#0b7a3a; --green-tint:#e4f9ea;
    --blue:#4f8cff;  --blue-2:#2f6fe6;  --blue-ink:#2358c9;  --blue-tint:#e8f0ff;
    --coral:#ff5a73; --coral-tint:#ffe9ed;
    --amber:#f5a524; --amber-tint:#fff2d9; --amber-ink:#9a5b00;

    /* role-driven (tenant = green, landlord = blue) */
    --primary:var(--green); --primary-2:var(--green-2); --primary-ink:var(--green-ink);
    --primary-tint:var(--green-tint); --on-primary:#052b12; --primary-glow:rgba(57,231,95,.45);

    --sh-d:rgba(150,166,185,.5); --sh-l:rgba(255,255,255,.95);
    --nm-in:inset 3px 3px 7px var(--sh-d), inset -3px -3px 7px var(--sh-l);
    --nm-out:4px 4px 10px var(--sh-d), -4px -4px 10px var(--sh-l);
    --elev:0 1px 2px rgba(22,32,30,.05), 0 14px 28px -18px rgba(22,32,30,.28);
    --elev-sm:0 1px 2px rgba(22,32,30,.05), 0 8px 16px -12px rgba(22,32,30,.25);
    --glass:rgba(255,255,255,.72); --glass-line:rgba(255,255,255,.85);

    --g:20px; --r-sm:12px; --r-md:18px; --r-lg:26px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121715; --surface:#1b2420; --surface-2:#17201c;
      --ink:#ebf3ef; --muted:#9db0aa; --faint:#71847d; --line:rgba(255,255,255,.08);
      --green-ink:#5ff08a; --green-tint:#16311f; --blue-ink:#8db4ff; --blue-tint:#172439;
      --coral-tint:#36202a; --amber-tint:#33270f; --amber-ink:#ffcf7a;
      --sh-d:rgba(0,0,0,.55); --sh-l:rgba(255,255,255,.035);
      --elev:0 1px 2px rgba(0,0,0,.4), 0 14px 28px -16px rgba(0,0,0,.7);
      --elev-sm:0 1px 2px rgba(0,0,0,.4), 0 8px 16px -12px rgba(0,0,0,.6);
      --glass:rgba(27,36,32,.72); --glass-line:rgba(255,255,255,.08);
    }
  }
  html[data-role="landlord"]{
    --primary:var(--blue); --primary-2:var(--blue-2); --primary-ink:var(--blue-ink);
    --primary-tint:var(--blue-tint); --on-primary:#ffffff; --primary-glow:rgba(79,140,255,.45);
  }

  /* ============ Base ============ */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font:400 14px/1.45 'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 32px;
  }
  button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; text-align:inherit;}
  h1,h2,h3,p{margin:0;}
  input{font:inherit;}
  :focus-visible{outline:2px solid var(--primary-ink); outline-offset:2px; border-radius:8px;}
  .ic{fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

  .buildtag{font:500 11.5px 'IBM Plex Mono',monospace; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:7px;}
  .buildtag .pip{width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary);}

  /* ============ Device frame ============ */
  .phone{
    width:372px; height:min(780px, calc(100vh - 84px)); min-height:620px; flex-shrink:0;
    background:var(--surface); border-radius:42px; padding:10px; position:relative;
    box-shadow:14px 14px 30px var(--sh-d), -14px -14px 30px var(--sh-l);
  }
  .notch{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:116px; height:22px; background:var(--ink); border-radius:0 0 15px 15px; opacity:.88; z-index:60;}
  .screen{width:100%; height:100%; background:var(--bg); border-radius:33px; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .statusbar{height:38px; display:flex; align-items:center; justify-content:space-between; padding:6px 26px 0; font:500 11.5px 'IBM Plex Mono',monospace; color:var(--muted); flex:none;}
  .statusbar .icons{display:flex; gap:6px; align-items:center;}
  .statusbar svg{width:15px; height:11px;}

  .body{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:0 var(--g) 112px; position:relative; scrollbar-width:none;}
  .body::-webkit-scrollbar{display:none;}
  .body[data-view="map"]{padding:0; overflow:hidden;}
  .body[data-view="chat"]{display:flex; flex-direction:column; overflow:hidden; padding-bottom:100px;}
  .body[data-view="detail"]{padding-bottom:128px;}
  .body[data-view="boot"], .body[data-view="roleSelect"]{padding-bottom:var(--g);}

  /* real phones: drop the device chrome, go full-bleed */
  @media (max-width:480px){
    body{padding:0; display:block;}
    .buildtag{display:none;}
    .phone{width:100%; height:100dvh; min-height:0; border-radius:0; padding:0; box-shadow:none;}
    .screen{border-radius:0;}
    .notch,.statusbar{display:none;}
    .body{padding-top:env(safe-area-inset-top,0px);}
    .body[data-view="map"]{padding-top:0;}
  }

  /* ============ Type + layout primitives ============ */
  .sub{font-size:13px; color:var(--muted);}
  .cap{font-size:12px; color:var(--muted);}
  .sec{display:flex; align-items:baseline; justify-content:space-between; margin:28px 0 14px;}
  .sec h2{font:600 17px/1.2 'Fraunces',serif; letter-spacing:-.01em;}
  .sec .link{font-size:13px; font-weight:600; color:var(--primary-ink);}
  .sec .count{font-size:12.5px; color:var(--muted);}
  .group-title{font-size:12.5px; font-weight:600; color:var(--muted); margin:28px 4px 10px;}
  .card{background:var(--surface); border-radius:var(--r-md); box-shadow:var(--elev); padding:18px;}
  .stack{display:grid; gap:14px;}

  .appbar{display:flex; align-items:center; justify-content:space-between; padding:10px 0 18px;}
  .brand{display:flex; align-items:center; gap:10px; font:700 21px 'Fraunces',serif; letter-spacing:-.01em;}
  .mark{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:var(--on-primary);
    background:linear-gradient(135deg,var(--primary),var(--primary-2)); box-shadow:0 8px 16px -8px var(--primary-glow);}
  .icon-btn{width:44px; height:44px; border-radius:15px; background:var(--surface); box-shadow:var(--nm-out); display:grid; place-items:center; position:relative; flex:none;}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn .dot{position:absolute; top:11px; right:12px; width:8px; height:8px; border-radius:50%; background:var(--coral); box-shadow:0 0 0 2px var(--surface);}
  .pagehead{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0 6px;}
  .pagehead h1{font:600 26px/1.15 'Fraunces',serif; letter-spacing:-.01em;}
  .who{display:flex; align-items:center; gap:12px;}
  .backbar{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px; padding:10px 0 18px;}
  .backbar h1{font:600 18px 'Fraunces',serif; text-align:center;}

  .avatar{border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font:600 14px 'Fraunces',serif; box-shadow:0 4px 10px -3px rgba(0,0,0,.25);}
  .avatar.sq{border-radius:32%;}

  /* ============ Controls ============ */
  .search{display:flex; align-items:center; gap:10px; height:52px; padding:0 14px 0 16px; border-radius:17px; background:var(--bg); box-shadow:var(--nm-in); color:var(--muted);}
  .search:focus-within{box-shadow:var(--nm-in), 0 0 0 3px var(--primary-tint);}
  .search input{flex:1; min-width:0; border:0; outline:0; background:none; font-size:14px; color:var(--ink);}
  .search input::placeholder{color:var(--faint);}
  .search .clear{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--surface); box-shadow:var(--elev-sm);}
  .search .clear[hidden]{display:none;}
  .chips{display:flex; gap:10px; margin:14px calc(var(--g)*-1) 0; padding:4px var(--g) 10px; overflow-x:auto; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; height:40px; padding:0 16px; border-radius:20px; background:var(--surface); box-shadow:var(--nm-out); font-size:13px; color:var(--muted); display:flex; align-items:center; transition:all .18s ease;}
  .chip[aria-pressed="true"]{background:var(--primary-tint); color:var(--primary-ink); box-shadow:var(--nm-in); font-weight:600;}
  .chip:active{transform:scale(.96);}
  .mini{height:36px; padding:0 16px; border-radius:12px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .mini.pri{background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:var(--on-primary); box-shadow:0 8px 16px -10px var(--primary-glow);}
  .mini.ghost{background:var(--surface-2); color:var(--muted); border:1px solid var(--line);}
  .mini:active{transform:scale(.96);}
  .seg{display:flex; gap:4px; padding:4px; border-radius:15px; background:var(--bg); box-shadow:var(--nm-in);}
  .seg button{flex:1; height:38px; border-radius:11px; font-size:13px; color:var(--muted); text-align:center;}
  .seg button[aria-selected="true"]{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:var(--elev-sm);}

  /* ============ Listing card ============ */
  .lcard{position:relative; background:var(--surface); border-radius:var(--r-md); box-shadow:var(--elev); overflow:hidden; margin-bottom:20px; animation:rise .45s cubic-bezier(.2,.8,.3,1) both;}
  .lcard-main{display:block; width:100%;}
  .lcard-main:active{opacity:.92;}
  .media{position:relative; height:164px; overflow:hidden;}
  .media .scene{width:100%; height:100%; display:block;}
  .media::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 38%,transparent 62%,rgba(0,0,0,.18)); pointer-events:none;}
  .badge{position:absolute; left:14px; top:14px; z-index:2; display:flex; align-items:center; gap:6px; height:28px; padding:0 11px; border-radius:14px; font:500 11.5px 'IBM Plex Mono',monospace; color:#fff; background:rgba(16,24,22,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
  .badge .ic{color:var(--green);}
  .fav{position:absolute; right:14px; top:14px; z-index:3; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.9); color:#16201e; box-shadow:0 4px 12px rgba(0,0,0,.15);}
  .fav:active{transform:scale(.88);}
  .fav.on{color:var(--coral);}
  .fav.on .ic{fill:var(--coral);}
  .lbody{padding:16px 18px 18px; display:grid; gap:10px;}
  .ltop{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
  .ltop h3{font:600 16px/1.3 'IBM Plex Sans',sans-serif;}
  .price{white-space:nowrap;}
  .price b{font:700 17px 'Fraunces',serif;}
  .price span{font-size:12px; color:var(--muted);}
  .loc{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted);}
  .tags{display:flex; gap:8px; flex-wrap:wrap;}
  .tag{font-size:12px; padding:5px 11px; border-radius:999px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line);}
  .tag.ok{background:var(--primary-tint); color:var(--primary-ink); border-color:transparent; font-weight:600;}
  @keyframes rise{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}

  .empty{text-align:center; padding:40px 16px 20px; display:grid; gap:10px; justify-items:center;}
  .empty .eico{width:56px; height:56px; border-radius:18px; display:grid; place-items:center; background:var(--surface); box-shadow:var(--nm-out); color:var(--muted);}
  .empty h3{font:600 16px 'Fraunces',serif;}
  .empty p{font-size:13px; color:var(--muted); max-width:240px;}

  /* ============ Map ============ */
  .map{position:absolute; inset:0; background:var(--surface-2); overflow:hidden;}
  .map svg.roads{position:absolute; inset:0; width:100%; height:100%;}
  .map .road{fill:none; stroke:var(--surface); stroke-linecap:round; vector-effect:non-scaling-stroke;}
  .maptop{position:absolute; top:10px; left:16px; right:16px; height:48px; display:flex; align-items:center; gap:10px; padding:0 16px; border-radius:17px; background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%); box-shadow:var(--elev); z-index:5;}
  .maptop b{font-weight:600; font-size:14px; flex:1;}
  .maptop span{font-size:12.5px; color:var(--muted);}
  .pin{position:absolute; transform:translate(-50%,-100%); z-index:2; isolation:isolate; padding:7px 12px; border-radius:999px; background:var(--surface); color:var(--ink); font:600 12.5px 'IBM Plex Sans',sans-serif; box-shadow:var(--elev); transition:transform .2s cubic-bezier(.3,1.4,.4,1), background .2s;}
  .pin::after{content:''; position:absolute; left:50%; bottom:-4px; width:10px; height:10px; background:inherit; border-radius:2px; transform:translateX(-50%) rotate(45deg); z-index:-1;}
  .pin.on{background:var(--primary); color:var(--on-primary); transform:translate(-50%,-100%) scale(1.14); z-index:4;}
  .campus{position:absolute; transform:translate(-50%,-50%); display:grid; justify-items:center; gap:6px; z-index:1;}
  .campus i{width:16px; height:16px; border-radius:50%; background:var(--blue); box-shadow:0 0 0 4px rgba(79,140,255,.25); position:relative;}
  .campus i::after{content:''; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--blue); animation:ping 2.2s ease-out infinite;}
  .campus span{font:500 11px 'IBM Plex Mono',monospace; padding:3px 8px; border-radius:8px; background:var(--surface); box-shadow:var(--elev-sm);}
  @keyframes ping{0%{transform:scale(1); opacity:.6;} 100%{transform:scale(2.6); opacity:0;}}
  .mcard{position:absolute; left:16px; right:16px; bottom:96px; z-index:6; display:flex; gap:14px; padding:12px; border-radius:22px; background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); box-shadow:var(--elev); width:calc(100% - 32px); animation:rise .3s ease both;}
  .mcard .th{width:76px; height:76px; border-radius:15px; overflow:hidden; flex:none;}
  .mcard .th .scene{width:100%; height:100%; display:block;}
  .mcard .info{flex:1; min-width:0; display:grid; gap:4px; align-content:center;}
  .mcard h3{font:600 14.5px/1.25 'IBM Plex Sans',sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* ============ Detail ============ */
  .hero{position:relative; height:250px; margin:0 calc(var(--g)*-1); border-radius:0 0 var(--r-lg) var(--r-lg); overflow:hidden;}
  .hero .scene{width:100%; height:100%; display:block;}
  .hero .top{position:absolute; left:16px; right:16px; top:12px; display:flex; justify-content:space-between; z-index:3;}
  .glass-btn{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.9); color:#16201e; box-shadow:0 4px 12px rgba(0,0,0,.15);}
  .glass-btn.on{color:var(--coral);} .glass-btn.on .ic{fill:var(--coral);}
  .hero .pill{position:absolute; right:16px; bottom:16px; z-index:3; display:flex; align-items:center; gap:6px; height:28px; padding:0 11px; border-radius:14px; font:500 11.5px 'IBM Plex Mono',monospace; color:#fff; background:rgba(16,24,22,.55); backdrop-filter:blur(8px);}
  .hero .badge{top:auto; bottom:16px;}
  .dhead{margin-top:22px; display:grid; gap:10px;}
  .dhead h1{font:600 24px/1.2 'Fraunces',serif; letter-spacing:-.01em;}
  .block{margin-top:28px;}
  .block > h2{font:600 17px 'Fraunces',serif; margin-bottom:14px;}
  .amen{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .amen div{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:15px; background:var(--surface); box-shadow:var(--elev-sm); font-size:13px;}
  .amen .ico{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--primary-tint); color:var(--primary-ink); flex:none;}
  .meter{display:grid; grid-template-columns:112px 1fr 30px; align-items:center; gap:12px; margin-top:16px;}
  .meter label{font-size:13px; color:var(--muted);}
  .meter .track{height:8px; border-radius:6px; background:var(--bg); box-shadow:var(--nm-in); overflow:hidden;}
  .meter i{display:block; height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,var(--green),var(--green-2)); transition:width .9s cubic-bezier(.2,.8,.2,1);}
  .meter b{font:600 12.5px 'IBM Plex Mono',monospace; text-align:right;}
  .foot-note{font-size:12px; color:var(--muted); margin-top:16px; padding-top:14px; border-top:1px solid var(--line);}
  .person{display:flex; align-items:center; gap:14px;}
  .person .txt{flex:1; min-width:0; display:grid; gap:2px;}
  .person .n{font-weight:600; font-size:15px;}
  .round-btn{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--primary-tint); color:var(--primary-ink); flex:none;}
  .actionbar{position:absolute; left:0; right:0; bottom:0; z-index:30; display:flex; align-items:center; gap:16px; padding:14px var(--g) calc(20px + env(safe-area-inset-bottom,0px)); background:var(--glass); backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%); border-top:1px solid var(--glass-line); transform:translateY(110%); transition:transform .3s cubic-bezier(.2,.8,.3,1);}
  .actionbar.show{transform:none;}
  .actionbar .p{display:grid; line-height:1.1;}
  .actionbar .p b{font:700 21px 'Fraunces',serif;}
  .actionbar .p span{font-size:12px; color:var(--muted);}
  .cta{flex:1; height:52px; border-radius:17px; font-weight:700; font-size:14.5px; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:var(--on-primary); box-shadow:0 12px 22px -10px var(--primary-glow);}
  .cta:active{transform:scale(.97);}
  .cta[disabled]{background:var(--primary-tint); color:var(--primary-ink); box-shadow:none; cursor:default;}

  /* ============ Chat ============ */
  .chead{display:flex; align-items:center; gap:12px; padding:10px 0 14px; flex:none;}
  .chead .t{display:grid; gap:1px;}
  .chead .n{font-weight:600; font-size:16px;}
  .online{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);}
  .online::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--green-2);}
  .ctx{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:16px; background:var(--surface); box-shadow:var(--elev-sm); flex:none; width:100%;}
  .ctx .th{width:44px; height:44px; border-radius:12px; overflow:hidden; flex:none;}
  .ctx .th .scene{width:100%; height:100%; display:block;}
  .ctx .txt{flex:1; min-width:0; display:grid;}
  .ctx .txt b{font-size:13.5px; font-weight:600;}
  .thread{flex:1; min-height:0; overflow-y:auto; padding:6px 0; scrollbar-width:none; display:flex; flex-direction:column; gap:10px;}
  .thread::-webkit-scrollbar{display:none;}
  .day{text-align:center; font-size:12px; color:var(--faint); margin:12px 0 2px;}
  .bubble{max-width:80%; padding:11px 15px; border-radius:19px; font-size:14px; line-height:1.45; animation:rise .3s ease both;}
  .bubble.them{align-self:flex-start; background:var(--surface); box-shadow:var(--elev-sm); border-bottom-left-radius:6px;}
  .bubble.me{align-self:flex-end; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:var(--on-primary); border-bottom-right-radius:6px;}
  .bubble.loc{display:flex; align-items:center; gap:10px;}
  .bubble.typing{display:flex; gap:5px; padding:15px 16px;}
  .bubble.typing i{width:6px; height:6px; border-radius:50%; background:var(--faint); animation:bob 1.1s infinite;}
  .bubble.typing i:nth-child(2){animation-delay:.15s;} .bubble.typing i:nth-child(3){animation-delay:.3s;}
  @keyframes bob{0%,60%,100%{transform:none; opacity:.5;} 30%{transform:translateY(-4px); opacity:1;}}
  .composer{display:flex; align-items:center; gap:10px; padding:8px 8px 8px 18px; border-radius:28px; background:var(--bg); box-shadow:var(--nm-in); margin-top:12px; flex:none;}
  .composer input{flex:1; min-width:0; border:0; outline:0; background:none; font-size:14px; color:var(--ink);}
  .composer button{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:var(--on-primary); box-shadow:0 8px 16px -8px var(--primary-glow);}
  .composer button:active{transform:scale(.9);}

  /* ============ Grouped lists ============ */
  .group{background:var(--surface); border-radius:var(--r-md); box-shadow:var(--elev); overflow:hidden;}

  .row .txt{flex:1; min-width:0;}
  .row .t, .row .s{display:block;}
  .row .t{font-size:14.5px; font-weight:500;}
  .row .s{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .row .end{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--faint); flex:none;}

  .toggle::after{content:''; position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.25); transition:all .2s;}
  .toggle.off{background:var(--bg); box-shadow:var(--nm-in);}
  .toggle.off::after{right:auto; left:3px; background:var(--surface);}

  .score{display:flex; align-items:center; gap:18px;}
  .ring{position:relative; width:88px; height:88px; flex:none;}
  .ring svg{transform:rotate(-90deg); filter:drop-shadow(0 0 6px var(--primary-glow));}
  .ring .num{position:absolute; inset:0; display:grid; place-items:center; font:700 22px 'Fraunces',serif;}
  .steps{display:flex; align-items:center; margin-top:14px;}
  .steps .n{width:10px; height:10px; border-radius:50%; background:var(--bg); box-shadow:var(--nm-in); flex:none;}
  .steps .n.d{background:var(--primary); box-shadow:0 0 6px var(--primary-glow);}
  .steps .s{flex:1; height:4px; background:var(--bg); box-shadow:var(--nm-in); border-radius:4px;}
  .steps .s.d{background:var(--primary); box-shadow:none;}
  .steplabels{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:8px;}

  .match{text-align:center; padding:24px 18px 22px; display:grid; justify-items:center; gap:6px;}
  .match .pct{font:700 46px/1 'Fraunces',serif; background:linear-gradient(135deg,var(--green),var(--green-ink)); -webkit-background-clip:text; background-clip:text; color:transparent; margin-top:4px;}
  .traits{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px;}
  .trait{font-size:12px; padding:6px 12px; border-radius:999px; background:var(--bg); box-shadow:var(--nm-in); color:var(--muted);}
  .pctchip{font:600 12.5px 'IBM Plex Mono',monospace; color:var(--primary-ink);}

  /* ============ Landlord ============ */
  .attn{display:flex; align-items:center; gap:16px; padding:18px; border-radius:var(--r-md); color:var(--on-primary); background:linear-gradient(135deg,var(--primary),var(--primary-2)); box-shadow:0 18px 30px -18px var(--primary-glow); margin-top:14px;}
  .attn .n{font:700 34px/1 'Fraunces',serif;}
  .attn .s{font-size:13px; opacity:.92; margin-top:2px;}

  .stat .ico{width:36px; height:36px; border-radius:11px; display:grid; place-items:center;}
  .stat b{font:700 26px/1 'Fraunces',serif; display:block;}
  .stat span{font-size:12.5px; color:var(--muted); display:block; margin-top:5px;}
  .chart{display:flex; align-items:flex-end; gap:10px; height:140px; margin-top:20px;}
  .bar{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%;}
  .bar .track{flex:1; width:100%; max-width:28px; display:flex; align-items:flex-end; overflow:hidden; border-radius:10px; background:var(--bg); box-shadow:var(--nm-in);}
  .bar i{width:100%; height:0; border-radius:10px; background:linear-gradient(180deg,var(--primary),var(--primary-2)); opacity:.5; transition:height .9s cubic-bezier(.2,.8,.2,1);}
  .bar.peak i{opacity:1;}
  .bar span{font-size:11.5px; color:var(--muted);}
  .lm{display:flex; gap:14px; padding:14px; align-items:center;}
  .lm .th{width:68px; height:68px; border-radius:16px; overflow:hidden; flex:none;}
  .lm .th .scene{width:100%; height:100%; display:block;}
  .lm .txt{flex:1; min-width:0; display:grid; gap:3px;}
  .lm .txt b{font-size:14.5px; font-weight:600;}
  .lm .stat-line{display:flex; gap:14px; font-size:12.5px; color:var(--muted); margin-top:3px;}
  .lm .stat-line span{display:inline-flex; align-items:center; gap:5px;}
  .status{margin-top:10px; justify-self:start; height:32px; padding:0 12px; border-radius:16px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; flex:none; align-self:flex-start;}
  .status::before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor;}
  .status.active{background:var(--green-tint); color:var(--green-ink);}
  .status.paused{background:var(--amber-tint); color:var(--amber-ink);}
  .inq{display:flex; gap:14px; padding:16px;}
  .inq + .inq{border-top:1px solid var(--line);}
  .inq .bd{flex:1; min-width:0; display:grid; gap:6px;}
  .inq .r1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .inq .nm{font-weight:600; font-size:14.5px;}

  /* ============ Nav / toast / splash ============ */
  .nav{position:absolute; left:16px; right:16px; bottom:16px; height:66px; z-index:40; display:flex; align-items:center; justify-content:space-around; padding:0 6px; border-radius:26px; background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(20px) saturate(170%); -webkit-backdrop-filter:blur(20px) saturate(170%); box-shadow:0 14px 30px -14px rgba(20,30,28,.35); transition:transform .3s cubic-bezier(.2,.8,.3,1), opacity .2s;}
  .nav.hide{transform:translateY(140%); opacity:0; pointer-events:none;}

  .nav-item[aria-current="page"]{color:var(--on-primary); background:linear-gradient(135deg,var(--primary),var(--primary-2)); box-shadow:0 8px 16px -8px var(--primary-glow); font-weight:600;}

  .toast{position:absolute; left:50%; bottom:108px; z-index:70; transform:translate(-50%,10px); opacity:0; padding:11px 18px; border-radius:15px; background:var(--ink); color:var(--bg); font-size:13px; font-weight:500; white-space:nowrap; pointer-events:none; transition:all .25s;}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  .splash{flex:1; display:grid; place-content:center; justify-items:center; gap:16px; animation:fade .3s;}
  .splash .logo{width:104px; height:104px; border-radius:30px; display:grid; place-items:center; color:var(--on-primary); background:linear-gradient(135deg,var(--primary),var(--primary-2)); box-shadow:0 22px 40px -14px var(--primary-glow);}
  .splash .w{font:700 32px 'Fraunces',serif;}
  .splash .t{font:italic 500 14.5px 'Fraunces',serif; color:var(--muted);}
  .splash .ld{width:108px; height:5px; border-radius:6px; background:var(--bg); box-shadow:var(--nm-in); overflow:hidden; margin-top:4px;}
  .splash .ld i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--primary),var(--primary-2)); animation:load .85s ease forwards;}
  @keyframes load{to{width:100%;}}
  .roles{flex:1; display:grid; align-content:center; gap:18px; padding:8px 0 20px;}
  .roles .hd{text-align:center; display:grid; gap:6px; justify-items:center; margin-bottom:6px;}
  .roles .hd h1{font:600 26px 'Fraunces',serif;}
  .role{display:block; width:100%; background:var(--surface); border-radius:24px; box-shadow:var(--elev); padding:22px; display:grid; gap:6px; animation:rise .45s ease both;}
  .role:active{transform:scale(.98);}
  .role .ico{width:50px; height:50px; border-radius:16px; display:grid; place-items:center; margin-bottom:8px;}
  .role h3{font:600 18px 'Fraunces',serif;}
  .role p{font-size:13.5px; color:var(--muted); line-height:1.5;}
  .role .go{display:flex; align-items:center; gap:6px; margin-top:10px; font-size:13.5px; font-weight:600;}
  .roles .note{text-align:center; font-size:12.5px; color:var(--faint);}

  /* ============ Screen transitions ============ */
  .fade{animation:fade .22s ease;} .push{animation:pushIn .3s cubic-bezier(.2,.8,.3,1);} .pop{animation:popIn .3s cubic-bezier(.2,.8,.3,1);}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  @keyframes pushIn{from{opacity:0; transform:translateX(28px);} to{opacity:1; transform:none;}}
  @keyframes popIn{from{opacity:0; transform:translateX(-28px);} to{opacity:1; transform:none;}}
  .static *{animation:none !important;}
  .static .meter i, .static .bar i, .static .conv i{transition:none !important;}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
</style>

<script>
/* ================= Icons ================= */
const P = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>',

  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',

const logo = (s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 16L106 55H95V97Q95 101 91 101H29Q25 101 25 97V55H14Z" fill="currentColor"/><circle cx="91" cy="93" r="21" fill="var(--primary)"/><circle cx="91" cy="93" r="16" fill="currentColor"/><path d="M83 93.5L89 99.5L100 85" stroke="var(--primary)" stroke-width="5.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const amenIcon = { 'Aircon':'aircon', 'Wifi':'wifi', 'Own CR':'bath', 'Shared CR':'bath', 'Parking':'car', 'Fan':'fan', 'Water included':'bath' };

/* ================= Art + avatars ================= */
let sceneN = 0;
function scene(hue) {
  const id = 's' + (++sceneN);
  return `<svg class="scene" viewBox="0 0 320 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="${hue}"/><stop offset="1" stop-color="${hue}" stop-opacity=".72"/></linearGradient></defs><rect width="320" height="220" fill="url(#${id})"/><g transform="translate(6,30)"><rect x="214" y="20" width="80" height="66" rx="6" fill="#fff" opacity=".18"/><rect x="224" y="30" width="60" height="46" rx="3" fill="#fff" opacity=".34"/><rect x="24" y="88" width="150" height="60" rx="12" fill="#fff" opacity=".95"/><rect x="24" y="88" width="150" height="20" rx="12" fill="#fff"/><circle cx="46" cy="98" r="9" fill="${hue}" opacity=".4"/><circle cx="66" cy="98" r="9" fill="${hue}" opacity=".25"/><rect x="184" y="112" width="26" height="36" rx="5" fill="#fff" opacity=".55"/><rect x="184" y="112" width="26" height="7" rx="3" fill="#fff" opacity=".85"/><circle cx="262" cy="128" r="18" fill="#fff" opacity=".22"/><path d="M248 140q14-30 28 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5"/></g></svg>`;

const AV = ['#22c55e', '#4f8cff', '#ff5a73', '#f5a524', '#8b6bff', '#0ea5a4'];
function avatar(name, size = 40, sq = false) {

  const col = AV[h % AV.length];
  const ini = name.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  return `<div class="avatar ${sq ? 'sq' : ''}" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px;background:linear-gradient(135deg,${col},${col}aa)">${ini}</div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const peso = n => '₱' + n.toLocaleString('en-US');

/* ================= Data ================= */
const AREAS = {
  'Carmen':    { flood: 80, power: 65, water: 85, safety: 78, reports: 12 },
  'Kauswagan': { flood: 45, power: 60, water: 60, safety: 52, reports: 5 },
  'Near MUST': { flood: 85, power: 80, water: 90, safety: 88, reports: 9 },

function row(o) {
  const tag = o.act ? 'button' : 'div';
  return `<${tag} class="row" ${o.act ? `data-act="${o.act}" ${o.v ? `data-v="${o.v}"` : ''}` : ''}>${o.ico ? `<span class="ico">${ic(o.ico, 18)}</span>` : ''}<span class="txt"><span class="t">${o.t}</span>${o.s ? `<span class="s">${o.s}</span>` : ''}</span><span class="end">${o.end || ''}</span></${tag}>`;

function steps(n, labels) {
  let h = '';

  return `<div class="steps">${h}</div><div class="steplabels">${labels.map(l => `<span>${l}</span>`).join('')}</div>`;
}
function results() {
  const q = state.query.trim().toLowerCase();

  <div class="card"><div class="loc" style="justify-content:space-between"><b style="color:var(--ink);font-size:15px">Views, last 7 days</b><span>${WEEK.reduce((a, b) => a + b, 0)} total</span></div>${chartHtml()}</div>
  <div class="group-title">Conversion by listing</div>
  <div class="card">${ml.map((l, i) => { const cv = l.inq / l.views * 100; return `<div class="conv" style="${i ? 'margin-top:20px' : 'margin-top:0'}"><div class="r"><b>${l.title}</b><span>${cv.toFixed(1)}%</span></div><div class="track"><i data-w="${Math.min(100, cv * 10)}"></i></div><span class="cap">${l.inq} inquiries from ${l.views} views</span></div>`; }).join('')}</div>
  <div class="group-title">Top performer</div>
  <div class="group lm"><div class="th">${scene(best.hue)}</div><div class="txt"><b>${best.title}</b><span class="cap">${best.views} views · ${best.inq} inquiries</span></div></div>`;
};

SCREENS.lsettings = () => `
  <header class="pagehead"><div class="who">${avatar('Mrs. Reyes', 60, true)}<div><h1 style="font-size:22px">Mrs. Reyes</h1><p class="sub">${mine().length} listings · Carmen, CDO</p></div></div></header>
  <div class="group-title">Verification</div>
  <div class="card"><b style="font-size:15px">Property verified</b><p class="cap">Next: an agent visit earns top ranking and featured placement.</p>${steps(4, ['Phone', 'ID', 'Property', 'Agent'])}</div>
  <div class="group-title">Notifications</div>
  <div class="group">${row({ t: 'New inquiries', act: 'toggle', end: sw(true) })}${row({ t: 'Saved-search matches', act: 'toggle', end: sw(true) })}${row({ t: 'Weekly performance email', act: 'toggle', end: sw(false) })}</div>
  <div class="group-title">Account</div>
  <div class="group">${row({ ico: 'swap', t: 'Switch to tenant view', act: 'switch', end: ic('chevR', 16) })}</div>`;

/* ================= Navigation + rendering ================= */
function navHtml(active) {
  const items = state.role === 'landlord'
    ? [['loverview', 'Overview', 'grid'], ['llistings', 'Listings', 'list'], ['linquiries', 'Inquiries', 'chat'], ['lsettings', 'Settings', 'gear']]
    : [['home', 'Home', 'home'], ['map', 'Map', 'map'], ['chat', 'Chat', 'chat'], ['profile', 'Profile', 'user']];
  return items.map(([k, l, i]) => `<button class="nav-item" data-act="tab" data-v="${k}" aria-current="${active === k ? 'page' : 'false'}">${ic(i, 20)}<span>${l}</span>${k === 'linquiries' && newCount() ? `<b class="nb">${newCount()}</b>` : ''}</button>`).join('');
}
function actionBarHtml() {
  const l = byId(state.selected), done = state.visit[l.id];
  return `<div class="p"><b>${peso(l.price)}</b><span>per month</span></div><button class="cta" data-act="visit" ${done ? 'disabled' : ''}>${done ? ic('check', 18) + 'Visit requested' : ic('shield', 18) + 'Request verified visit'}</button>`;
}
let lastView = null;
function render(dir) {
  const view = topView(), body = $('#body');
  const same = view === lastView && !dir, keep = same ? body.scrollTop : 0;
  body.dataset.view = view;
  body.className = 'body'; void body.offsetWidth;
  body.className = 'body ' + (same ? 'static' : dir === 'push' ? 'push' : dir === 'pop' ? 'pop' : 'fade');
  body.innerHTML = SCREENS[view]();
  body.scrollTop = keep;

  const hideNav = ['boot', 'roleSelect', 'detail'].includes(view);
  $('#nav').classList.toggle('hide', hideNav);
  if (!hideNav) $('#nav').innerHTML = navHtml(state.stack[0]);
  const ab = $('#actionbar');
  if (view === 'detail') { ab.innerHTML = actionBarHtml(); ab.classList.add('show'); } else ab.classList.remove('show');

  requestAnimationFrame(() => {
    document.querySelectorAll('.meter i, .conv i').forEach(e => e.style.width = e.dataset.w + '%');
    document.querySelectorAll('.bar i').forEach(e => e.style.height = e.dataset.h + '%');
    const arc = $('#ringArc'); if (arc) { arc.style.transition = same ? 'none' : 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)'; arc.style.strokeDashoffset = arc.dataset.t; }
  });
  if (view === 'chat') { const t = $('#thread'); t.scrollTop = t.scrollHeight; if (same) $('#chatInput').focus(); }
  lastView = view;
}
const push = v => { state.stack.push(v); render('push'); };
const pop = () => { if (state.stack.length > 1) state.stack.pop(); render('pop'); };
const setTab = t => { state.stack = [t]; render('tab'); };
function setRole(r) {
  state.role = r; document.documentElement.dataset.role = r;
  state.stack = [r === 'landlord' ? 'loverview' : 'home']; render('tab');
}
let tt;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1900); }
let rt;
function send() {
  const i = $('#chatInput'), v = (i.value || '').trim(); if (!v) return;
  state.chat.push({ who: 'me', text: v }); state.typing = true; render();
  clearTimeout(rt);
  rt = setTimeout(() => { state.typing = false; state.chat.push({ who: 'them', text: "Got it — I'll confirm and get back to you shortly." }); if (topView() === 'chat') render(); }, 1200);
}

/* ================= Events (delegated) ================= */
const phone = $('#phone');
phone.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'role': setRole(v); break;
    case 'tab': setTab(v); break;
    case 'back': pop(); break;
    case 'open': state.selected = v; push('detail'); break;
    case 'pin': state.selected = v; render(); break;
    case 'save': { const on = !state.saved.has(v); on ? state.saved.add(v) : state.saved.delete(v); render(); toast(on ? 'Saved to favorites' : 'Removed from favorites'); break; }
    case 'chip': state.filters.has(v) ? state.filters.delete(v) : state.filters.add(v); render(); break;
    case 'clearq': state.query = ''; render(); break;
    case 'clearall': state.query = ''; state.filters.clear(); render(); break;
    case 'chat': setTab('chat'); break;
    case 'roommate': push('roommate'); break;
    case 'analytics': push('lanalytics'); break;
    case 'visit': state.visit[state.selected] = true; render(); toast('Verified visit requested'); break;
    case 'toggle': { const s = t.querySelector('.toggle'); s.classList.toggle('off'); s.setAttribute('aria-checked', !s.classList.contains('off')); break; }
    case 'switch': state.role = null; delete document.documentElement.dataset.role; state.stack = ['roleSelect']; render('tab'); break;
    case 'reply': { const i = state.inq.find(x => x.id === v); i.status = 'replied'; render(); toast('Reply sent to ' + i.name); break; }
    case 'ignore': state.inq = state.inq.filter(x => x.id !== v); render(); toast('Inquiry dismissed'); break;
    case 'inqf': state.inqFilter = v; render(); break;
    case 'lstatus': { const l = byId(v); l.status = l.status === 'active' ? 'paused' : 'active'; render(); toast(l.status === 'active' ? 'Listing is live' : 'Listing paused'); break; }
    case 'bell': toast("You're all caught up"); break;
    case 'add': toast('Add listing is coming soon'); break;
    case 'send': send(); break;
  }
});
phone.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  state.query = e.target.value;
  $('#results').innerHTML = resultsHtml(); $('#count').textContent = countText();
  $('.search .clear').hidden = !e.target.value;
});
phone.addEventListener('keydown', e => { if (e.target.id === 'chatInput' && e.key === 'Enter') send(); });

render();
setTimeout(() => { state.stack = ['roleSelect']; render('tab'); }, 900);
</script>
</body>
</html>
