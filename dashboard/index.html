<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>landlord dashboard — early build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11181a; --surface:#182422; --surface-soft:#14201d;
    --ink:#e9f3ee; --ink-soft:#8aa19a; --line:rgba(255,255,255,0.07);
    --green:#39e75f; --green-deep:#26c96f; --green-tint:#16301f;
    --blue:#4f8cff; --blue-deep:#2f6fe6; --blue-tint:#152540;
    --coral:#ff6b81; --coral-tint:#33191f;
    --amber:#ffb020; --amber-tint:#332510;
    --purple:#8b6bff;
    --sh-d:rgba(0,0,0,0.55); --sh-l:rgba(255,255,255,0.045);
    --shadow-out:6px 6px 14px var(--sh-d), -6px -6px 14px var(--sh-l);
    --shadow-out-sm:3px 3px 7px var(--sh-d), -3px -3px 7px var(--sh-l);
    --shadow-in:inset 4px 4px 9px var(--sh-d), inset -4px -4px 9px var(--sh-l);
    --glass-bg:rgba(24,36,34,0.6); --glass-border:rgba(255,255,255,0.09);
  }
  :root[data-theme="light"]{
    --bg:#eef3f1; --surface:#ffffff; --surface-soft:#f6faf8;
    --ink:#1c2624; --ink-soft:#748381; --line:rgba(28,38,36,0.08);
    --green-tint:#e3fbe9; --blue-tint:#e8f0ff; --coral-tint:#ffe9ec; --amber-tint:#fff3dd;
    --sh-d:rgba(163,177,198,0.55); --sh-l:rgba(255,255,255,0.9);
    --glass-bg:rgba(255,255,255,0.6); --glass-border:rgba(255,255,255,0.7);
  }
  .topstrip{height:3px;background:linear-gradient(90deg, var(--blue), var(--green));position:fixed;top:0;left:0;right:0;z-index:50;}

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; display:flex;
    padding-top:calc(env(safe-area-inset-top,0px) + 3px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  /* sidebar */
  .sidebar{
    width:232px;flex-shrink:0;min-height:100vh;padding:22px 16px;
    display:flex;flex-direction:column;gap:6px;
    background:var(--glass-bg);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
    border-right:1px solid var(--glass-border);
    position:sticky;top:3px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;}
  .brand .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg, var(--blue), var(--blue-deep));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -6px rgba(79,140,255,0.55);}
  .brand .mark svg{width:18px;height:18px;stroke:#fff;}
  .brand .word{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  .brand .sub{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--ink-soft);}

  .navitem{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;
    color:var(--ink-soft);font-size:13px;font-weight:500;cursor:pointer;background:none;border:none;
    text-align:left;font-family:'IBM Plex Sans';transition:all .18s ease;width:100%;
  }
  .navitem svg{width:17px;height:17px;}
  .navitem:hover{color:var(--ink);}
  .navitem.on{color:var(--blue);background:var(--blue-tint);font-weight:600;box-shadow:inset 3px 0 0 var(--blue);}
  .navbadge{margin-left:auto;background:var(--coral);color:#fff;font-size:9.5px;border-radius:10px;padding:1px 6px;font-family:'IBM Plex Mono';}

  .sidebar-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-out-sm);}
  .avatar{border-radius:30%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-weight:600;box-shadow:0 4px 10px -2px rgba(0,0,0,0.35);}
  .sidebar-foot .name{font-size:12px;font-weight:600;}
  .sidebar-foot .role{font-size:10px;color:var(--ink-soft);}

  /* main */
  .main{flex:1;min-width:0;padding:26px 32px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .topbar h1{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin:0;}
  .topbar .subtitle{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .searchbox{display:flex;align-items:center;gap:8px;background:var(--bg);box-shadow:var(--shadow-in);border-radius:14px;padding:10px 14px;color:var(--ink-soft);min-width:200px;}
  .searchbox input{border:none;background:none;outline:none;font-size:12.5px;color:var(--ink);flex:1;font-family:'IBM Plex Sans';}
  .iconbtn{width:40px;height:40px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-out-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--ink-soft);flex-shrink:0;transition:transform .15s ease;}
  .iconbtn:active{transform:scale(0.92);}
  .iconbtn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--surface);}
  .btn-primary{
    display:flex;align-items:center;gap:7px;background:linear-gradient(135deg, var(--blue), var(--blue-deep));color:#fff;
    border:none;border-radius:14px;padding:11px 18px;font-size:12.5px;font-weight:600;cursor:pointer;
    box-shadow:0 10px 22px -8px rgba(79,140,255,0.55);font-family:'IBM Plex Sans';transition:transform .15s ease;flex-shrink:0;
  }
  .btn-primary:active{transform:scale(0.96);}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-out);padding:18px;animation:cardIn .4s ease both;}
  .stat-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .stat-card .ic-wrap{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
  .stat-card .trend{font-size:10.5px;font-family:'IBM Plex Mono';font-weight:600;display:flex;align-items:center;gap:2px;}
  .stat-card .trend.up{color:var(--green-deep);}
  .stat-card .trend.down{color:var(--coral);}
  .stat-card .num{font-family:'IBM Plex Mono', monospace;font-size:25px;font-weight:600;letter-spacing:-0.01em;}
  .stat-card .label{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-out);padding:20px;margin-bottom:20px;animation:cardIn .4s ease both;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .panel-head h3{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0;}
  .panel-head .meta{font-size:11px;color:var(--ink-soft);}
  .two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;}

  /* chart */
  .chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px;}
  .chart .colwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
  .chart .col{width:100%;max-width:28px;background:var(--bg);box-shadow:var(--shadow-in);border-radius:8px;position:relative;overflow:hidden;height:100%;display:flex;align-items:flex-end;}
  .chart .col i{display:block;width:100%;background:linear-gradient(180deg, var(--blue), var(--blue-deep));border-radius:8px;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1);}
  .chart .dlabel{font-size:9.5px;color:var(--ink-soft);font-family:'IBM Plex Mono';}

  /* donut */
  .donut-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;}
  .donut{position:relative;width:130px;height:130px;}
  .donut svg{transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(79,140,255,0.45));}
  .donut .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut .num b{font-family:'IBM Plex Mono', monospace;font-size:22px;font-weight:600;}
  .donut .num span{font-size:9.5px;color:var(--ink-soft);}

  /* listings table */
  .lrow{display:flex;align-items:center;gap:14px;padding:12px 8px;border-radius:14px;transition:background .15s ease;}
  .lrow:hover{background:var(--surface-soft);}
  .lthumb{width:54px;height:54px;border-radius:12px;overflow:hidden;flex-shrink:0;}
  .lthumb svg{width:100%;height:100%;display:block;}
  .lrow .title{font-size:13px;font-weight:600;}
  .lrow .sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .lrow .stats{display:flex;gap:18px;font-size:11.5px;color:var(--ink-soft);flex-shrink:0;}
  .lrow .stats b{color:var(--ink);font-weight:600;}
  .status-pill{font-size:10px;font-family:'IBM Plex Mono';padding:4px 9px;border-radius:20px;flex-shrink:0;font-weight:600;}
  .status-pill.active{background:var(--green-tint);color:var(--green-deep);}
  .status-pill.paused{background:var(--amber-tint);color:var(--amber);}
  .status-pill.verified{background:var(--blue-tint);color:var(--blue);}
  .lrow .edit{width:32px;height:32px;border-radius:10px;background:var(--bg);box-shadow:var(--shadow-out-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink-soft);transition:transform .15s ease;}
  .lrow .edit:active{transform:scale(0.9);}

  /* inquiries */
  .inq{display:flex;gap:12px;padding:14px 8px;border-radius:14px;transition:background .15s ease;}
  .inq:hover{background:var(--surface-soft);}
  .inq .body{flex:1;min-width:0;}
  .inq .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .inq .name{font-size:12.5px;font-weight:600;}
  .inq .time{font-size:10px;color:var(--ink-soft);font-family:'IBM Plex Mono';flex-shrink:0;}
  .inq .for{font-size:10.5px;color:var(--ink-soft);margin:2px 0 5px;}
  .inq .msg{font-size:12px;color:var(--ink);line-height:1.5;}
  .inq .actions{display:flex;gap:8px;margin-top:10px;}
  .inq .actions button{
    font-size:11px;font-weight:600;padding:6px 13px;border-radius:10px;border:none;cursor:pointer;
    font-family:'IBM Plex Sans';transition:transform .15s ease;
  }
  .inq .actions .reply{background:linear-gradient(135deg, var(--blue), var(--blue-deep));color:#fff;box-shadow:0 6px 14px -5px rgba(79,140,255,0.55);}
  .inq .actions .ignore{background:var(--bg);box-shadow:var(--shadow-out-sm);color:var(--ink-soft);}
  .inq .actions button:active{transform:scale(0.94);}
  .inq.replied .msg{color:var(--ink-soft);}
  .repliedtag{font-size:10px;font-family:'IBM Plex Mono';color:var(--green-deep);display:flex;align-items:center;gap:4px;margin-top:8px;}

  /* verification tier */
  .tier-steps{display:flex;align-items:center;}
  .tier-steps .seg{flex:1;height:4px;background:var(--bg);box-shadow:var(--shadow-in);border-radius:4px;}
  .tier-steps .seg.done{background:linear-gradient(90deg, var(--green), var(--green-deep));box-shadow:none;}
  .tier-steps .node{width:10px;height:10px;border-radius:50%;background:var(--bg);box-shadow:var(--shadow-in);flex-shrink:0;}
  .tier-steps .node.done{background:var(--green);box-shadow:0 0 6px var(--green);}
  .steplabels{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-soft);margin-top:7px;}

  .divider{height:1px;background:var(--line);margin:4px 0;}

  .empty-note{font-size:12px;color:var(--ink-soft);text-align:center;padding:20px 0;}

  .fade{animation:fadein .22s ease;}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}

  @media (max-width: 980px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
  }
  @media (max-width: 720px){
    body{flex-direction:column;}
    .sidebar{width:100%;min-height:auto;flex-direction:row;align-items:center;overflow-x:auto;position:relative;padding:14px;}
    .brand{padding:0 12px 0 0;}
    .sidebar-foot{margin-top:0;margin-left:auto;}
    .navitem span:last-child{display:none;}
    .navitem{padding:10px;}
    .main{padding:20px 16px 40px;}
    .grid{grid-template-columns:1fr 1fr;}
  }
  @media (prefers-reduced-motion: reduce){ .fade,.stat-card,.panel,.inq,.lrow{animation:none !important;} }
</style>
</head>
<body>
  <div class="topstrip"></div>

      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"/><path d="M9 12.5l2 2 4-4.5"/></svg></div>

<script>
const ic = {
  grid: `<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,

  inbox: `<svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
  bars: `<svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>`,
  gear: `<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  eye: `<svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px;"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`,
  chat: `<svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px;"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
  edit: `<svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`,
  up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:10px;height:10px;"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>`,
  down: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:10px;height:10px;"><path d="M12 5v14"/><path d="M18 13l-6 6-6-6"/></svg>`,
};

function roomScene(hue, id){
  return `<svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="bg${id}" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="${hue}"/><stop offset="1" stop-color="${hue}" stop-opacity="0.72"/>
    </linearGradient></defs>
    <rect width="300" height="150" fill="url(#bg${id})"/>
    <rect x="205" y="16" width="72" height="58" rx="5" fill="#fff" opacity="0.16"/>
    <rect x="213" y="24" width="56" height="42" rx="2" fill="#fff" opacity="0.32"/>
    <rect x="18" y="78" width="132" height="50" rx="10" fill="#fff" opacity="0.94"/>
    <rect x="18" y="78" width="132" height="18" rx="10" fill="#fff"/>
    <circle cx="36" cy="87" r="8" fill="${hue}" opacity="0.45"/>
  </svg>`;
}
const AV_COLORS = ['#39e75f','#4f8cff','#ff6b81','#ffb020','#8b6bff','#12a150'];
function avatar(name, size){
  size = size || 34;
  let hash = 0; for(const c of name) hash += c.charCodeAt(0);
  const color = AV_COLORS[hash % AV_COLORS.length];
  const initials = name.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.36)}px;background:linear-gradient(135deg, ${color}, ${color}99);">${initials}</div>`;
}

const LISTINGS = [
  { id:'l1', title:'Solo room, Carmen', sub:'0.6km to USTP · Female-only', price:'₱3,500/mo', hue:'#39e75f', status:'active', verified:true, views:184, inquiries:6 },

const state = { tab:'overview', inquiries: INQUIRIES_INIT.map(i=>({...i})) };

const PAGES = {
  overview: { title:'Overview', sub:'How your listings are doing this week' },
  listings: { title:'Listings', sub:'Manage what tenants see on the marketplace' },
  inquiries: { title:'Inquiries', sub:'Messages and visit requests from tenants' },
  analytics: { title:'Analytics', sub:'Views, conversion, and performance by listing' },
  settings: { title:'Settings', sub:'Profile, verification tier, and notifications' },
};

function statCard(iconSvg, tint, num, label, trend, trendUp){
  return `
    <div class="stat-card">
      <div class="top">
        <div class="ic-wrap" style="background:${tint};color:${trendUp===null?'var(--ink-soft)':'inherit'};">${iconSvg}</div>
        ${trend!==null? `<div class="trend ${trendUp?'up':'down'}">${trendUp?ic.up:ic.down}${trend}</div>` : ''}
      </div>
      <div class="num">${num}</div>
      <div class="label">${label}</div>
    </div>`;
}

function screenOverview(){
  const totalViews = LISTINGS.reduce((a,l)=>a+l.views,0);
  const totalInq = LISTINGS.reduce((a,l)=>a+l.inquiries,0);
  const active = LISTINGS.filter(l=>l.status==='active').length;
  const newInq = state.inquiries.filter(i=>i.status==='new').length;

  return `
    <div class="grid">
      ${statCard(`<svg class="ic" viewBox="0 0 24 24" style="stroke:var(--green-deep);"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>`, 'var(--green-tint)', active, 'Active listings', '2', true)}
      ${statCard(`<svg class="ic" viewBox="0 0 24 24" style="stroke:var(--blue);"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`, 'var(--blue-tint)', totalViews, 'Total views', '18%', true)}
      ${statCard(`<svg class="ic" viewBox="0 0 24 24" style="stroke:var(--coral);"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`, 'var(--coral-tint)', totalInq, 'Inquiries', newInq+' new', true)}
      ${statCard(`<svg class="ic" viewBox="0 0 24 24" style="stroke:var(--amber);"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>`, 'var(--amber-tint)', '82%', 'Occupancy rate', null, null)}
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><h3>Views this week</h3><span class="meta">${totalViews} total</span></div>
        <div class="chart" id="weeklyChart">
          ${WEEKLY_VIEWS.map((v,i)=>`
            <div class="colwrap">
              <div class="col"><i data-h="${Math.round((v/Math.max(...WEEKLY_VIEWS))*100)}"></i></div>
              <div class="dlabel">${DAY_LABELS[i]}</div>
            </div>`).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Occupancy</h3></div>
        <div class="donut-wrap">
          <div class="donut">
            <svg width="130" height="130" viewBox="0 0 130 130">
              <circle cx="65" cy="65" r="54" fill="none" stroke="var(--bg)" stroke-width="12"/>
              <circle id="occRing" cx="65" cy="65" r="54" fill="none" stroke="var(--blue)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="339.3" stroke-dashoffset="339.3" data-target="61.1"/>
            </svg>
            <div class="num"><b>82%</b><span>filled rooms</span></div>
          </div>
          <div class="meta" style="font-size:11px;">5 of 6 rooms occupied across listings</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Recent inquiries</h3><span class="meta">${newInq} unread</span></div>
      ${state.inquiries.slice(0,3).map(i=>inquiryRow(i,true)).join('<div class="divider"></div>')}
    </div>
  `;
}

function screenListings(){
  return `
    <div class="panel">
      <div class="panel-head"><h3>Your listings</h3><span class="meta">${LISTINGS.length} total</span></div>
      ${LISTINGS.map((l,idx)=>`
        <div class="lrow">
          <div class="lthumb">${roomScene(l.hue,'dash'+l.id)}</div>
          <div style="flex:1;min-width:0;">
            <div class="title">${l.title}</div>
            <div class="sub">${l.sub} · ${l.price}</div>
          </div>
          <div class="stats">
            <span>${ic.eye}&nbsp;<b>${l.views}</b></span>
            <span>${ic.chat}&nbsp;<b>${l.inquiries}</b></span>
          </div>
          <span class="status-pill ${l.status}">${l.status==='active'?'Active':'Paused'}</span>
          ${l.verified? `<span class="status-pill verified">Verified</span>` : ''}
          <div class="edit">${ic.edit}</div>
        </div>
        ${idx<LISTINGS.length-1? '<div class="divider"></div>' : ''}
      `).join('')}
    </div>
  `;
}

function inquiryRow(i, compact){
  const replied = i.status === 'replied';
  return `
    <div class="inq ${replied?'replied':''}" data-inq="${i.id}">
      ${avatar(i.name, 38)}
      <div class="body">
        <div class="row1"><span class="name">${i.name}</span><span class="time">${i.time}</span></div>
        <div class="for">re: ${i.listing}</div>
        <div class="msg">${i.msg}</div>
        ${replied
          ? `<div class="repliedtag">✓ Replied</div>`
          : (compact ? '' : `<div class="actions">
              <button class="reply" data-reply="${i.id}">Reply</button>
              <button class="ignore" data-ignore="${i.id}">Ignore</button>
            </div>`)
        }
      </div>
    </div>`;
}

function screenInquiries(){
  return `
    <div class="panel">
      <div class="panel-head"><h3>All inquiries</h3><span class="meta">${state.inquiries.length} total</span></div>
      ${state.inquiries.map((i,idx)=> inquiryRow(i,false) + (idx<state.inquiries.length-1?'<div class="divider"></div>':'')).join('')}
    </div>
  `;
}

function screenAnalytics(){
  const best = LISTINGS.reduce((a,b)=> b.views>a.views? b : a);
  return `
    <div class="panel">
      <div class="panel-head"><h3>Views this week</h3><span class="meta">All listings combined</span></div>
      <div class="chart" id="weeklyChart2">
        ${WEEKLY_VIEWS.map((v,i)=>`
          <div class="colwrap">
            <div class="col"><i data-h="${Math.round((v/Math.max(...WEEKLY_VIEWS))*100)}"></i></div>
            <div class="dlabel">${DAY_LABELS[i]}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><h3>Views vs. inquiries by listing</h3></div>
        ${LISTINGS.map((l,idx)=>`
          <div style="margin-bottom:${idx<LISTINGS.length-1?'16px':'0'};">
            <div class="row1" style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;"><span>${l.title}</span><span class="meta">${l.inquiries}/${l.views} inquiries/views</span></div>
            <div class="bar" style="height:8px;background:var(--bg);box-shadow:var(--shadow-in);border-radius:6px;overflow:hidden;"><i class="convbar" data-w="${Math.min(100, Math.round((l.inquiries/Math.max(1,l.views))*100*6))}" style="display:block;height:100%;width:0;background:linear-gradient(90deg, var(--blue), var(--blue-deep));border-radius:6px;transition:width 1s ease;"></i></div>
          </div>
        `).join('')}
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Top performer</h3></div>
        <div class="lthumb" style="width:100%;height:100px;border-radius:14px;margin-bottom:12px;">${roomScene(best.hue,'top')}</div>
        <div class="title" style="font-size:14px;">${best.title}</div>
        <div class="sub" style="margin-top:4px;">${best.views} views · ${best.inquiries} inquiries this week</div>
      </div>
    </div>
  `;
}

function screenSettings(){
  return `
    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><h3>Profile</h3></div>
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
          ${avatar('Mrs. Reyes', 56)}
          <div><div class="title" style="font-size:15px;">Mrs. Reyes</div><div class="sub">2 active listings · Carmen, CDO</div></div>
        </div>
        <div class="panel-head"><h3 style="font-size:13px;">Verification tier</h3><span class="meta">Property verified</span></div>
        <div class="tier-steps">
          <div class="node done"></div><div class="seg done"></div>
          <div class="node done"></div><div class="seg done"></div>
          <div class="node done"></div><div class="seg"></div>
          <div class="node"></div>
        </div>
        <div class="steplabels"><span>Phone+email</span><span>ID verified</span><span>Property verified</span><span>Agent visit</span></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Notifications</h3></div>
        <div class="lrow" style="padding:10px 4px;"><span style="flex:1;">New inquiries</span><span class="status-pill active">On</span></div>
        <div class="divider"></div>
        <div class="lrow" style="padding:10px 4px;"><span style="flex:1;">Saved-search matches</span><span class="status-pill active">On</span></div>
        <div class="divider"></div>
        <div class="lrow" style="padding:10px 4px;"><span style="flex:1;">Weekly performance email</span><span class="status-pill paused">Off</span></div>
      </div>
    </div>
  `;
}

function navHtml(){
  const items = [
    ['overview', ic.grid, 'Overview', null],
    ['listings', ic.list, 'Listings', null],
    ['inquiries', ic.inbox, 'Inquiries', state.inquiries.filter(i=>i.status==='new').length],
    ['analytics', ic.bars, 'Analytics', null],
    ['settings', ic.gear, 'Settings', null],
  ];
  return items.map(([key,icon,label,badge])=>`
    <button class="navitem ${state.tab===key?'on':''}" data-nav="${key}">
      ${icon}<span>${label}</span>${badge? `<span class="navbadge">${badge}</span>` : ''}
    </button>`).join('');
}

function render(){
  document.getElementById('navList').innerHTML = navHtml();
  document.getElementById('landlordAvatar').innerHTML = avatar('Mrs. Reyes', 36);
  document.getElementById('pageTitle').textContent = PAGES[state.tab].title;
  document.getElementById('pageSubtitle').textContent = PAGES[state.tab].sub;

  const content = document.getElementById('content');
  let html = '';
  if(state.tab==='overview') html = screenOverview();
  else if(state.tab==='listings') html = screenListings();
  else if(state.tab==='inquiries') html = screenInquiries();
  else if(state.tab==='analytics') html = screenAnalytics();
  else if(state.tab==='settings') html = screenSettings();

  content.classList.remove('fade'); void content.offsetWidth;
  content.innerHTML = html;
  content.classList.add('fade');

  requestAnimationFrame(()=>{
    document.querySelectorAll('.chart .col i').forEach(el=>{ el.style.height = el.dataset.h + '%'; });
    document.querySelectorAll('.convbar').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
    const ring = document.getElementById('occRing');
    if(ring){ ring.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)'; ring.style.strokeDashoffset = ring.dataset.target; }
  });

  document.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click', ()=>{ state.tab = b.dataset.nav; render(); }));
  document.querySelectorAll('[data-reply]').forEach(b=> b.addEventListener('click', ()=>{
    const item = state.inquiries.find(i=>i.id===b.dataset.reply);
    if(item) item.status='replied';
    render();
  }));
  document.querySelectorAll('[data-ignore]').forEach(b=> b.addEventListener('click', ()=>{
    state.inquiries = state.inquiries.filter(i=>i.id!==b.dataset.ignore);
    render();
  }));
}

render();
</script>
</body>
</html>
