<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumi — your home away from home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f1; --surface:#ffffff; --surface-soft:#f6faf8;
    --ink:#1c2624; --ink-soft:#748381; --line:rgba(28,38,36,0.08);
    --green:#39e75f; --green-deep:#12a150; --green-tint:#e3fbe9;
    --blue:#4f8cff; --blue-deep:#2f6fe6; --blue-tint:#e8f0ff;
    --coral:#ff6b81; --coral-tint:#ffe9ec;
    --amber:#ffb020; --amber-tint:#fff3dd;
    --sh-d:rgba(163,177,198,0.55); --sh-l:rgba(255,255,255,0.9);
    --shadow-out:6px 6px 14px var(--sh-d), -6px -6px 14px var(--sh-l);
    --shadow-out-sm:3px 3px 7px var(--sh-d), -3px -3px 7px var(--sh-l);
    --shadow-in:inset 4px 4px 9px var(--sh-d), inset -4px -4px 9px var(--sh-l);
    --glass-bg:rgba(255,255,255,0.6); --glass-border:rgba(255,255,255,0.7);
    --primary:#39e75f; --primary-deep:#12a150; --primary-tint:#e3fbe9;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#181c1b; --surface:#20302a; --surface-soft:#1c2622; --ink:#eaf3ef; --ink-soft:#8ea19c;
      --line:rgba(255,255,255,0.08); --green-tint:#173321; --blue-tint:#182338; --coral-tint:#331e22; --amber-tint:#332812;
      --sh-d:rgba(0,0,0,0.55); --sh-l:rgba(255,255,255,0.04);
      --glass-bg:rgba(32,48,42,0.6); --glass-border:rgba(255,255,255,0.08);
    }
  }
  :root[data-theme="dark"]{
    --bg:#181c1b; --surface:#20302a; --surface-soft:#1c2622; --ink:#eaf3ef; --ink-soft:#8ea19c;
    --line:rgba(255,255,255,0.08); --green-tint:#173321; --blue-tint:#182338; --coral-tint:#331e22; --amber-tint:#332812;
    --sh-d:rgba(0,0,0,0.55); --sh-l:rgba(255,255,255,0.04);
    --glass-bg:rgba(32,48,42,0.6); --glass-border:rgba(255,255,255,0.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:30px 16px 46px;
  }
  .buildtag{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); margin-bottom:14px; display:flex; align-items:center; gap:7px;}
  .buildtag .pip{width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary);animation:pulseDot 2.4s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}

  .phone{
    width:336px; height:690px; flex-shrink:0; background:var(--surface); border-radius:38px;
    box-shadow:14px 14px 30px var(--sh-d), -14px -14px 30px var(--sh-l); padding:10px; position:relative;
  }
  .phone .notch{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:112px; height:20px; background:var(--ink); border-radius:0 0 14px 14px; opacity:.85; z-index:5;}
  .screen{width:100%; height:100%; background:var(--bg); border-radius:30px; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .statusbar{height:34px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); flex-shrink:0;}
  .statusbar .icons{display:flex; align-items:center; gap:5px;}
  .statusbar svg{width:15px;height:11px;}
  .screen-body{flex:1; overflow-y:auto; overflow-x:hidden; padding:0 16px 96px; display:flex; flex-direction:column;}
  .screen-body::-webkit-scrollbar{width:0;}

  .backrow{display:flex; align-items:center; gap:8px; padding:6px 0 10px; color:var(--ink-soft); font-size:13px; cursor:pointer; user-select:none; transition:color .15s ease, transform .15s ease;}
  .backrow svg{width:16px;height:16px;}
  .backrow:active{opacity:.6; transform:translateX(-2px);}

  .bottom-nav{
    position:absolute; left:14px; right:14px; bottom:14px; height:64px; display:flex; align-items:center; justify-content:space-around;
    border-radius:24px; background:var(--glass-bg); border:1px solid var(--glass-border);
    backdrop-filter:blur(18px) saturate(180%); -webkit-backdrop-filter:blur(18px) saturate(180%);
    box-shadow:0 10px 26px -10px rgba(20,30,28,0.28); z-index:20;
  }
  .bottom-nav .item{display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-soft); font-size:9.5px; cursor:pointer; background:none; border:none; font-family:'IBM Plex Sans'; padding:7px 13px; border-radius:16px; transition:all .22s cubic-bezier(.3,1,.4,1);}
  .bottom-nav .item.on{color:#fff; background:linear-gradient(135deg, var(--primary), var(--primary-deep)); box-shadow:0 6px 14px -4px rgba(57,231,95,0.5); transform:translateY(-2px);}
  .bottom-nav .item.on svg{transform:scale(1.05);}
  .bottom-nav .item:active{transform:scale(.9);}
  .bottom-nav svg{width:19px;height:19px;}

  svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .sec-label{font-family:'Fraunces',serif; font-size:15px; margin:8px 0 8px; font-weight:600;}

  .searchbar{display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:16px; padding:12px 14px; margin:6px 0 12px; box-shadow:var(--shadow-in); color:var(--ink-soft);}
  .searchbar input{border:none; background:none; outline:none; font-family:'IBM Plex Sans'; font-size:13px; color:var(--ink); flex:1;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 12px;}
  .chip{font-size:11.5px; white-space:nowrap; padding:8px 13px; border-radius:20px; border:none; color:var(--ink-soft); font-family:'IBM Plex Sans'; background:var(--surface); flex-shrink:0; cursor:pointer; box-shadow:var(--shadow-out-sm); transition:all .18s ease;}
  .chip.on{color:var(--primary-deep); background:var(--primary-tint); box-shadow:var(--shadow-in); font-weight:600;}
  .chip:active{transform:scale(.94);}

  .card{border:none; border-radius:22px; background:var(--surface); overflow:hidden; margin-bottom:14px; cursor:pointer; animation:cardIn .4s cubic-bezier(.2,.8,.3,1) both; box-shadow:var(--shadow-out); transition:box-shadow .2s ease, transform .15s ease;}
  .card:active{transform:scale(.98);}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .thumb{height:112px; position:relative; overflow:hidden;}
  .thumb svg{width:100%;height:100%;display:block;}
  .thumb-overlay{position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:space-between; padding:9px; background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.24) 100%);}
  .thumb .save{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease;box-shadow:0 4px 10px rgba(0,0,0,.15);}
  .thumb .save:active{transform:scale(.8);}
  .badge{font-size:10px;font-family:'IBM Plex Mono',monospace;color:#fff;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.4);padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:4px;}
  .badge.verified{background:rgba(57,231,95,.32);border-color:rgba(57,231,95,.6);}
  .card .info{padding:12px 14px 14px;}
  .row1{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .card .row1{align-items:flex-start;}
  .card .title{font-size:13.5px;font-weight:600;line-height:1.3;}
  .card .price{font-size:13px;color:var(--green-deep);font-weight:700;white-space:nowrap;}
  .card .meta{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .empty{padding:30px 0;text-align:center;color:var(--ink-soft);font-size:12.5px;}

  .stamp{display:inline-flex;align-items:center;gap:6px;color:var(--green-deep);border-radius:20px;padding:6px 11px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(10px);box-shadow:0 4px 14px -4px rgba(57,231,95,.5);animation:stampIn .4s cubic-bezier(.3,1.4,.4,1) both;}
  @keyframes stampIn{from{opacity:0;transform:scale(1.5);}to{opacity:1;transform:scale(1);}}

  .avatar{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-weight:600;box-shadow:0 4px 10px -2px rgba(0,0,0,.2);}
  .avatar.sq{border-radius:30%;}

  .map-area{position:relative;height:300px;flex-shrink:0;border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-out);margin-top:8px;}
  .blob{position:absolute;border-radius:50%;filter:blur(22px);}
  .route{position:absolute;inset:0;width:100%;height:100%;}
  .route path{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:6 7;opacity:.55;animation:march 1.6s linear infinite;}
  @keyframes march{to{stroke-dashoffset:-26;}}
  .campus{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .campus .dot{width:14px;height:14px;border-radius:50%;background:var(--blue);position:relative;box-shadow:0 0 10px var(--blue);}
  .campus .dot::after{content:'';position:absolute;inset:-6px;border:2px solid var(--blue);border-radius:50%;animation:pulseRing 2.2s ease-out infinite;}
  .campus .lbl{font-size:9px;font-family:'IBM Plex Mono';background:var(--surface);box-shadow:var(--shadow-out-sm);border-radius:8px;padding:3px 6px;white-space:nowrap;}
  @keyframes pulseRing{0%{transform:scale(1);opacity:.55;}100%{transform:scale(2.8);opacity:0;}}
  .pin{position:absolute;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);cursor:pointer;transition:transform .2s cubic-bezier(.3,1.4,.4,1);border:2px solid #fff;}
  .pin.active{width:28px;height:28px;transform:rotate(-45deg) scale(1.08);}
  .pin:active{transform:rotate(-45deg) scale(.85);}
  .sheet{position:absolute;bottom:0;left:0;right:0;background:var(--glass-bg);backdrop-filter:blur(18px) saturate(180%);border-top:1px solid var(--glass-border);border-radius:20px 20px 0 0;padding:12px 16px 16px;box-shadow:0 -8px 20px rgba(0,0,0,.08);cursor:pointer;animation:sheetUp .3s cubic-bezier(.2,.8,.3,1) both;}
  .sheet .handle{width:32px;height:4px;border-radius:4px;background:var(--ink-soft);opacity:.3;margin:0 auto 8px;}
  @keyframes sheetUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  .gallery{height:170px;flex-shrink:0;border-radius:22px;margin-top:6px;position:relative;overflow:hidden;box-shadow:var(--shadow-out);}
  .gallery svg{width:100%;height:100%;display:block;}
  .gallery .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:4px;justify-content:center;}
  .dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);}
  .dots span:first-child{background:#fff;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-top:14px;gap:8px;}
  .amen-row{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;}
  .amen{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-soft);font-size:9.5px;background:var(--surface);box-shadow:var(--shadow-out-sm);border-radius:14px;padding:9px 12px;flex:1;min-width:58px;}
  .insight-card{border-radius:18px;background:var(--surface);box-shadow:var(--shadow-out);padding:14px;margin:14px 0;}
  .insight-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .insight-row .bar{flex:1;height:7px;background:var(--bg);box-shadow:var(--shadow-in);border-radius:6px;overflow:hidden;}
  .insight-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-deep));border-radius:6px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .insight-row span{font-size:10.5px;color:var(--ink-soft);width:62px;flex-shrink:0;}
  .landlord-row{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:var(--shadow-out);border-radius:16px;padding:12px 14px;margin-top:8px;}
  .btnrow{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;text-align:center;padding:13px;border-radius:16px;font-size:12.5px;font-weight:600;font-family:'IBM Plex Sans';cursor:pointer;border:none;transition:transform .15s ease, opacity .2s ease;}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;box-shadow:0 10px 22px -8px rgba(57,231,95,.55);}
  .btn.primary:disabled{opacity:.55;cursor:default;box-shadow:none;}
  .btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-out-sm);}
  .btn:active:not(:disabled){transform:scale(.96);}

  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 0;flex-shrink:0;}
  .chat-thread{flex:1;overflow-y:auto;padding-top:4px;}
  .bubble{max-width:76%;padding:10px 14px;border-radius:18px;font-size:12.5px;line-height:1.5;margin:8px 0;animation:bubbleIn .3s cubic-bezier(.25,.9,.3,1.2) both;}
  @keyframes bubbleIn{from{opacity:0;transform:translateY(8px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  .bubble.them{background:var(--surface);box-shadow:var(--shadow-out-sm);border-bottom-left-radius:5px;}
  .bubble.me{background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;margin-left:auto;border-bottom-right-radius:5px;box-shadow:0 6px 16px -6px rgba(57,231,95,.55);}
  .bubble.loc{display:flex;align-items:center;gap:8px;}
  .bubble.typing{display:flex;gap:4px;align-items:center;padding:13px 15px;}
  .bubble.typing span{width:5px;height:5px;border-radius:50%;background:var(--ink-soft);animation:typingBounce 1.1s ease-in-out infinite;}
  .bubble.typing span:nth-child(2){animation-delay:.15s;}
  .bubble.typing span:nth-child(3){animation-delay:.3s;}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
  .inputbar{display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg);box-shadow:var(--shadow-in);border-radius:22px;padding:8px 10px;margin-top:8px;}
  .inputbar .field{flex:1;background:none;border:none;padding:6px 8px;font-size:12px;color:var(--ink);outline:none;font-family:'IBM Plex Sans';}
  .inputbar button{background:linear-gradient(135deg,var(--green),var(--green-deep));border:none;color:#fff;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s ease;box-shadow:0 4px 10px -3px rgba(57,231,95,.6);}
  .inputbar button:active{transform:scale(.85);}

  .match-hero{text-align:center;padding:20px 0 12px;background:var(--surface);box-shadow:var(--shadow-out);border-radius:20px;margin-top:6px;}
  .match-hero .pct{font-family:'Fraunces',serif;font-size:44px;font-weight:700;background:linear-gradient(135deg,var(--green),var(--green-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .trait-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px;}
  .trait{font-size:10.5px;font-family:'IBM Plex Mono';border-radius:20px;padding:5px 10px;color:var(--ink-soft);background:var(--bg);box-shadow:var(--shadow-in);}
  .roommate-card{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow-out-sm);border-radius:16px;margin-top:10px;animation:cardIn .4s ease both;}

  .profile-hero{display:flex;align-items:center;gap:12px;padding:14px 0;}
  .score-card{border-radius:20px;padding:16px;background:var(--surface);box-shadow:var(--shadow-out);margin:10px 0;display:flex;align-items:center;gap:16px;}
  .score-ring{position:relative;width:76px;height:76px;flex-shrink:0;}
  .score-ring svg{transform:rotate(-90deg);filter:drop-shadow(0 0 6px rgba(57,231,95,.5));}
  .score-ring.blue svg{filter:drop-shadow(0 0 6px rgba(79,140,255,.5));}
  .score-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:var(--green-deep);}
  .score-ring.blue .num{color:var(--blue);}
  .tier-steps{display:flex;align-items:center;margin-top:12px;}
  .tier-steps .seg{flex:1;height:4px;background:var(--bg);box-shadow:var(--shadow-in);border-radius:4px;}
  .tier-steps .seg.done{background:linear-gradient(90deg,var(--primary),var(--primary-deep));box-shadow:none;}
  .tier-steps .node{width:9px;height:9px;border-radius:50%;background:var(--bg);box-shadow:var(--shadow-in);flex-shrink:0;}
  .tier-steps .node.done{background:var(--primary);box-shadow:0 0 6px var(--primary);}
  .steplabels{display:flex;justify-content:space-between;font-size:9px;color:var(--ink-soft);margin-top:6px;}
  .list-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;background:var(--surface);box-shadow:var(--shadow-out-sm);border-radius:14px;margin-bottom:8px;font-size:12.5px;cursor:pointer;transition:transform .15s ease;}
  .list-row:not(.static):active{transform:scale(.98);}
  .list-row.static{cursor:default;}
  .toggle{width:34px;height:20px;border-radius:20px;position:relative;flex-shrink:0;cursor:pointer;transition:background .2s ease;background:linear-gradient(135deg,var(--primary),var(--primary-deep));box-shadow:0 3px 8px -2px rgba(57,231,95,.5);}
  .toggle::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;right:2px;transition:right .2s ease,left .2s ease;box-shadow:0 2px 4px rgba(0,0,0,.2);}
  .toggle.off{background:var(--bg);box-shadow:var(--shadow-in);}
  .toggle.off::after{right:auto;left:2px;background:var(--surface);}

  /* landlord: stat + chart + table-ish rows */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .stat-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-out);padding:13px;animation:cardIn .4s ease both;}
  .stat-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .stat-card .ic-wrap{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .stat-card .num{font-family:'Fraunces',serif;font-size:20px;font-weight:700;}
  .stat-card .label{font-size:10px;color:var(--ink-soft);margin-top:2px;}
  .chart{display:flex;align-items:flex-end;gap:7px;height:110px;flex-shrink:0;padding-top:6px;}
  .chart .colwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .chart .col{width:100%;max-width:20px;background:var(--bg);box-shadow:var(--shadow-in);border-radius:6px;position:relative;overflow:hidden;height:100%;display:flex;align-items:flex-end;}
  .chart .col i{display:block;width:100%;background:linear-gradient(180deg,var(--blue),var(--blue-deep));border-radius:6px;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1);}
  .chart .dlabel{font-size:8.5px;color:var(--ink-soft);font-family:'IBM Plex Mono';}
  .lrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-radius:14px;}
  .lthumb{width:46px;height:46px;min-height:46px;border-radius:12px;overflow:hidden;flex-shrink:0;}
  .lthumb svg{width:100%;height:100%;display:block;}
  .status-pill{font-size:9.5px;font-family:'IBM Plex Mono';padding:4px 8px;border-radius:20px;flex-shrink:0;font-weight:600;}
  .status-pill.active{background:var(--green-tint);color:var(--green-deep);}
  .status-pill.paused{background:var(--amber-tint);color:#a56800;}
  .status-pill.verified{background:var(--blue-tint);color:var(--blue);}
  .inq{display:flex;gap:10px;padding:12px 4px;}
  .inq .bodyx{flex:1;min-width:0;}
  .inq .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .inq .name{font-size:12px;font-weight:600;}
  .inq .time{font-size:9.5px;color:var(--ink-soft);font-family:'IBM Plex Mono';flex-shrink:0;}
  .inq .for{font-size:10px;color:var(--ink-soft);margin:2px 0 4px;}
  .inq .msg{font-size:11.5px;color:var(--ink);line-height:1.45;}
  .inq .actions{display:flex;gap:7px;margin-top:9px;}
  .inq .actions button{font-size:10.5px;font-weight:600;padding:6px 11px;border-radius:9px;border:none;cursor:pointer;font-family:'IBM Plex Sans';transition:transform .15s ease;}

function screenLAnalytics(){

  return `

function screenLSettings(){

      <div class="tier-steps"><div class="node done"></div><div class="seg done"></div><div class="node done"></div><div class="seg done"></div><div class="node done"></div><div class="seg"></div><div class="node"></div></div>
      <div class="steplabels"><span>Phone</span><span>ID</span><span>Property</span><span>Agent visit</span></div>

// ---------- render / dispatch ----------
function render(direction){
  const view = topView();
  const body = document.getElementById('screenBody');
  const nav = document.getElementById('bottomNav');
  let html = '';
  if(view==='boot') html = screenBoot();
  else if(view==='roleSelect') html = screenRoleSelect();
  else if(view==='home') html = screenHome();
  else if(view==='map') html = screenMap();
  else if(view==='chat') html = screenChat();
  else if(view==='profile') html = screenProfile();
  else if(view==='detail') html = screenDetail();
  else if(view==='roommate') html = screenRoommate();
  else if(view==='loverview') html = screenLOverview();
  else if(view==='llistings') html = screenLListings();
  else if(view==='linquiries') html = screenLInquiries();
  else if(view==='lanalytics') html = screenLAnalytics();
  else if(view==='lsettings') html = screenLSettings();

  body.classList.remove('fade','slide-in-right','slide-in-left');
  void body.offsetWidth;
  body.innerHTML = html;
  if(direction==='push') body.classList.add('slide-in-right');
  else if(direction==='pop') body.classList.add('slide-in-left');
  else body.classList.add('fade');

  const showNav = !['boot','roleSelect'].includes(view);
  nav.style.display = showNav ? 'flex' : 'none';
  if(showNav) nav.innerHTML = bottomNavHtml(state.stack[0]);

  if(view==='chat'){ const t=document.getElementById('chatThread'); t.scrollTop = t.scrollHeight; }
  if(view==='detail'){ requestAnimationFrame(()=>{ document.querySelectorAll('.insight-row .bar i').forEach(el=>{ el.style.width = el.dataset.w + '%'; }); }); }
  if(view==='profile'){ requestAnimationFrame(()=>{ const r=document.getElementById('scoreRing'); if(r){ r.style.transition='stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)'; r.style.strokeDashoffset=r.dataset.target; } }); }
  if(view==='loverview' || view==='lanalytics'){
    requestAnimationFrame(()=>{
      document.querySelectorAll('.chart .col i').forEach(el=>{ el.style.height = el.dataset.h + '%'; });
      document.querySelectorAll('.convbar').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
    });
  }

  attachHandlers(view);
}

function attachHandlers(view){
  document.querySelectorAll('[data-role]').forEach(el=> el.addEventListener('click', ()=> setRole(el.dataset.role)));
  document.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.tab)));
  document.querySelectorAll('[data-back]').forEach(b=> b.addEventListener('click', pop));
  document.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', ()=>{ state.selected = el.dataset.open; push('detail'); }));
  document.querySelectorAll('[data-pin]').forEach(el=> el.addEventListener('click', ()=>{ state.selected = el.dataset.pin; render(); }));
  document.querySelectorAll('[data-save]').forEach(el=> el.addEventListener('click', (e)=>{ e.stopPropagation(); const id=el.dataset.save; state.saved.has(id)?state.saved.delete(id):state.saved.add(id); render(); }));
  document.querySelectorAll('[data-chip]').forEach(el=> el.addEventListener('click', ()=>{ state.chipOn = state.chipOn===el.dataset.chip ? null : el.dataset.chip; render(); }));
  const searchInput = document.getElementById('searchInput');
  if(searchInput){ searchInput.addEventListener('input', ()=>{ state.query=searchInput.value; render(); const el=document.getElementById('searchInput'); el.focus(); el.selectionStart=el.selectionEnd=el.value.length; }); }
  const gotoChat = document.querySelector('[data-goto-chat]'); if(gotoChat) gotoChat.addEventListener('click', ()=> setTab('chat'));
  const gotoRoommate = document.querySelector('[data-goto-roommate]'); if(gotoRoommate) gotoRoommate.addEventListener('click', ()=> push('roommate'));
  const gotoAnalytics = document.querySelector('[data-open-analytics]'); if(gotoAnalytics) gotoAnalytics.addEventListener('click', ()=> push('lanalytics'));
  const visitBtn = document.getElementById('visitBtn'); if(visitBtn) visitBtn.addEventListener('click', ()=>{ state.visitRequested=true; render(); });
  document.querySelectorAll('[data-toggle]').forEach(el=> el.addEventListener('click', ()=> el.classList.toggle('off')));
  document.querySelectorAll('[data-switch-role]').forEach(el=> el.addEventListener('click', ()=>{ state.stack=['roleSelect']; render('tab'); }));
  document.querySelectorAll('[data-reply]').forEach(b=> b.addEventListener('click', ()=>{ const item=state.inquiries.find(i=>i.id===b.dataset.reply); if(item) item.status='replied'; render(); }));
  document.querySelectorAll('[data-ignore]').forEach(b=> b.addEventListener('click', ()=>{ state.inquiries = state.inquiries.filter(i=>i.id!==b.dataset.ignore); render(); }));

  if(view==='chat'){
    const send = ()=>{
      const input=document.getElementById('chatInput'); const val=input.value.trim(); if(!val) return;
      state.chat.push({who:'me', text:val}); input.value=''; state.isTyping=true; render();
      setTimeout(()=>{ state.isTyping=false; state.chat.push({who:'them', text:'Got it, thanks for the message!'}); render(); }, 1100);
    };
    document.getElementById('chatSend').addEventListener('click', send);
    document.getElementById('chatInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') send(); });
  }
}

render();
setTimeout(()=>{ state.stack=['roleSelect']; render('tab'); }, 900);
</script>
